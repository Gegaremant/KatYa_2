name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: ./gradlew :androidApp:assembleFossDebug --no-daemon --stacktrace

      - name: Determine Version and Tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${TAG_NAME#v}"
            VERSION="${VERSION#.}"
          else
            VERSION=$(grep 'appVersion =' gradle/libs.versions.toml | cut -d '"' -f 2)
            if [ -z "$VERSION" ]; then
              VERSION="3.0.3"
            fi
            TAG_NAME="v${VERSION}"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Prepare APK Asset
        run: |
          APK_FILE=$(find androidApp/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "Katya-${VERSION}-android-debug.apk"
            echo "Successfully prepared Katya-${VERSION}-android-debug.apk from $APK_FILE"
            ls -la Katya-${VERSION}-android-debug.apk
          else
            echo "::error::No APK file found in androidApp/build/outputs/apk!"
            exit 1
          fi

      - name: Extract Changelog
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            sed -n "/^## v${VERSION}/,/^## v/{ /^## v${VERSION}/d; /^## v/d; p; }" RELEASE_NOTES.md > changelog.txt
            if [ ! -s changelog.txt ]; then
              sed -n "/^## v\.${VERSION}/,/^## v/{ /^## v\.${VERSION}/d; /^## v/d; p; }" RELEASE_NOTES.md > changelog.txt
            fi
          fi
          if [ ! -s changelog.txt ]; then
            git log -n 10 --pretty=format:"- %s" --no-merges > changelog.txt
          fi
          cat changelog.txt

      - name: Create or Update Github Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          body_path: changelog.txt
          files: Katya-${{ env.VERSION }}-android-debug.apk
          make_latest: true
          overwrite: true