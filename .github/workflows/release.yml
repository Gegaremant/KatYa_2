name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      # GitHub-hosted runners come with the Android SDK preinstalled
      # (ANDROID_HOME=/usr/local/lib/android/sdk) and accepted licenses,
      # so no setup-android step is needed — the archived action breaks here.

      # The shipped APK is a debug build, so it must not fall back to the
      # auto-generated ~/.android/debug.keystore — that key is different on
      # every runner and makes the APK uninstallable over the previous release.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KATYA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KATYA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KATYA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::KATYA_KEYSTORE_BASE64 is missing — refusing to ship an APK with a throwaway signature"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/katya-signing"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/katya-signing/katya-release.jks"
          keytool -list -keystore "${RUNNER_TEMP}/katya-signing/katya-release.jks" \
            -storepass "${KEYSTORE_PASSWORD}" -alias "${KEY_ALIAS}" > /dev/null
          {
            echo "KEYSTORE_FILE=${RUNNER_TEMP}/katya-signing/katya-release.jks"
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
            echo "KEY_ALIAS=${KEY_ALIAS}"
          } >> "${GITHUB_ENV}"

      - name: Build APK
        run: ./gradlew :androidApp:assembleFossDebug --no-daemon --stacktrace

      # Feedback #1: "обновление не накладывается, приходится переустанавливать" is
      # what Android reports when the new APK carries a different signing certificate
      # than the installed one. The keystore secret being present is not enough — it
      # can still be the wrong key, or Gradle can silently fall back to the debug key.
      # So check the certificate of the artifact we are about to publish against the
      # one every shipped release since 3.1.3-fix was signed with.
      - name: Verify signing certificate
        env:
          EXPECTED_SHA256: "79:FF:04:D2:48:31:61:4C:A8:08:36:EF:B2:BE:3F:74:DA:7B:B7:8D:07:77:EE:B7:E8:1A:DF:70:72:B3:2C:70"
        run: |
          set -euo pipefail
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "${APKSIGNER}" ]; then
            echo "::error::apksigner not found under ${ANDROID_HOME}/build-tools"
            exit 1
          fi
          APK=$(find androidApp/build/outputs/apk -name '*.apk' -type f | head -1)
          if [ -z "${APK}" ]; then
            echo "::error::no APK produced by assembleFossDebug"
            exit 1
          fi
          # apksigner prints "V2 Signer: certificate SHA-256 digest: <hex>" with no
          # colons; the expected value is the colon-separated uppercase form.
          RAW=$("${APKSIGNER}" verify --print-certs "${APK}" \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          if [ -z "${RAW}" ]; then
            echo "::error::could not read a signing certificate from ${APK}"
            exit 1
          fi
          ACTUAL=$(printf '%s' "${RAW}" | tr -d ' ' | tr '[:lower:]' '[:upper:]' \
            | sed 's/.\{2\}/&:/g; s/:$//')
          echo "APK: ${APK}"
          echo "SHA-256: ${ACTUAL}"
          if [ "${ACTUAL}" != "${EXPECTED_SHA256}" ]; then
            echo "::error::Signing certificate mismatch — this APK cannot be installed over the previous release"
            exit 1
          fi
          echo "Signing certificate matches the shipped release."

      - name: Unit tests
        # A release that ships with failing logic tests is not a release. The tests
        # live in the shared KMP module, hence the host-test task.
        run: ./gradlew :composeApp:testAndroidHostTest :androidApp:testFossDebugUnitTest --no-daemon --stacktrace

      - name: Determine Version and Tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${TAG_NAME#v}"
            VERSION="${VERSION#.}"
          else
            VERSION=$(grep 'appVersion =' gradle/libs.versions.toml | cut -d '"' -f 2)
            if [ -z "$VERSION" ]; then
              VERSION="3.0.3"
            fi
            TAG_NAME="v${VERSION}"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Prepare APK Asset
        run: |
          APK_FILE=$(find androidApp/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "Katya-${VERSION}-android-debug.apk"
            echo "Successfully prepared Katya-${VERSION}-android-debug.apk from $APK_FILE"
            ls -la Katya-${VERSION}-android-debug.apk
          else
            echo "::error::No APK file found in androidApp/build/outputs/apk!"
            exit 1
          fi

      - name: Extract Changelog
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            sed -n "/^## v${VERSION}/,/^## v/{ /^## v${VERSION}/d; /^## v/d; p; }" RELEASE_NOTES.md > changelog.txt
            if [ ! -s changelog.txt ]; then
              sed -n "/^## v\.${VERSION}/,/^## v/{ /^## v\.${VERSION}/d; /^## v/d; p; }" RELEASE_NOTES.md > changelog.txt
            fi
          fi
          if [ ! -s changelog.txt ]; then
            git log -n 10 --pretty=format:"- %s" --no-merges > changelog.txt
          fi
          cat changelog.txt

      - name: Create or Update Github Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          body_path: changelog.txt
          files: Katya-${{ env.VERSION }}-android-debug.apk
          make_latest: true
          overwrite: true