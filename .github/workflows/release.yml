name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    name: Generate APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;36.0.0"
          sdkmanager "build-tools;29.0.3"

      - name: Build APK
        run: bash ./gradlew :androidApp:assembleFossDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: androidApp/build/outputs/apk/foss/debug/androidApp-foss-debug.apk

  release:
    name: Release APK
    needs: [apk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: debug-apk

      - name: Determine Version and Tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${TAG_NAME#v}"
            VERSION="${VERSION#.}"
          else
            VERSION=$(grep 'appVersion =' gradle/libs.versions.toml | cut -d '"' -f 2)
            if [ -z "$VERSION" ]; then
              VERSION="3.0.3"
            fi
            TAG_NAME="v${VERSION}"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Rename assets
        run: |
          mv androidApp-foss-debug.apk "Katya-${VERSION}-android-debug.apk"

      - name: Extract changelog
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            sed -n "/^## v${VERSION}/,/^## v/{ /^## v${VERSION}/d; /^## v/d; p; }" RELEASE_NOTES.md > changelog.txt
            if [ ! -s changelog.txt ]; then
              sed -n "/^## v\.${VERSION}/,/^## v/{ /^## v\.${VERSION}/d; /^## v/d; p; }" RELEASE_NOTES.md > changelog.txt
            fi
          fi
          # Fallback if RELEASE_NOTES.md missing or section empty
          if [ ! -s changelog.txt ]; then
            PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG_NAME}$" | head -n1)
            if [ -z "$PREVIOUS_TAG" ]; then
              git log -n 10 --pretty=format:"- %s" --no-merges > changelog.txt
            else
              git log --pretty=format:"- %s" "${PREVIOUS_TAG}..HEAD" --no-merges > changelog.txt
            fi
          fi

      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          body_path: changelog.txt
          files: Katya-*