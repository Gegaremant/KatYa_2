name: Desktop Windows

# Отдельный workflow по той же причине, что и Linux: десктопная сборка требует
# jpackage и не имеет отношения к Android-сборке.
#
# Публикуется не .msi, а распакованный образ приложения, запакованный в zip.
# Причина конкретная, а не «на всякий случай»: jpackage собирает .msi через
# WiX, и сборщик `light.exe` на образе windows-latest завершается кодом 311 —
# провалом внутренней проверки целостности. Что именно он нашёл, jpackage в
# журнал не пишет: передаёт только код. Три прогона потратили на угадывание
# (WiX 3.14 вручную, короткий TEMP, `perUserInstall`, длинные пути) — каждый
# раз 311. Ловить настоящее сообщение ICE можно было бы только подменой
# `light.exe` на обёртку, а это отдельная работа; образ приложения пользователю
# нужен сейчас.
#
# Образ работает без установки и без прав администратора: распаковать и запустить.
# Когда появится способ узнать текст ошибки от `light.exe`, .msi вернётся отдельным
# шагом, а `TargetFormat.Msi` в build.gradle.kts остаётся для локальных сборок на
# Windows, где WiX настроен у разработчика.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package Windows build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Компоненты Android-сборки не нужны: rootfs, proot и jniLibs в пакет для
      # Windows не попадают. Скрипт их не тянет сознательно.

      # Собирается образ, а не установщик: `createDistributable` не требует WiX,
      # поэтому не зависит от того, чем настроен раннер.
      - name: Build application image
        run: .\gradlew.bat :composeApp:createDistributable --no-daemon --stacktrace

      - name: Locate application image
        id: pkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          $app = Get-ChildItem -Path 'composeApp/build/compose/binaries/main/app' -Directory -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $app) {
            throw 'no application image produced by :composeApp:createDistributable'
          }
          $exe = Join-Path $app.FullName 'KatYa.exe'
          if (-not (Test-Path $exe)) {
            Get-ChildItem $app.FullName | Select-Object -First 20 | Format-Table | Out-String | Write-Host
            throw "no KatYa.exe inside $($app.FullName)"
          }
          Write-Host $app.FullName
          # PKG_PATH читают следующие шаги; положен и в outputs, и в окружение,
          # чтобы шаг не зависел от того, объявлен ли здесь `id`.
          "path=$($app.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "PKG_PATH=$($app.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Образ проверяется на диске, а не установкой: тихая установка меняет раннер и
      # возвращает ненулевой код даже при успехе. Проверяется то, что ломается именно
      # при упаковке — запуск на месте и наличие нативной библиотеки Skiko, без
      # которой приложение падает на старте с LibraryLoadException.
      - name: Verify application image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          $app = $env:PKG_PATH
          $libDir = Join-Path $app 'app'

          $cfg = Join-Path $libDir 'KatYa.cfg'
          if (-not (Test-Path $cfg)) {
            throw "no KatYa.cfg in $libDir"
          }
          $entries = Get-Content $cfg | Where-Object { $_ -match '^app\.classpath=' }
          if ($entries.Count -lt 50) {
            throw "classpath lists only $($entries.Count) jars — the app classes did not get packaged"
          }
          $missing = 0
          foreach ($entry in $entries) {
            $name = $entry -replace '^app\.classpath=\$APPDIR/', ''
            if ($name -and -not (Test-Path (Join-Path $libDir $name))) {
              Write-Host "::error::classpath references a missing file: $name"
              $missing++
            }
          }
          if ($missing -ne 0) {
            throw "$missing of $($entries.Count) classpath entries are missing"
          }

          $skiko = @(Get-ChildItem -Path $libDir -Filter 'libskiko-*.dll' -File -ErrorAction SilentlyContinue)
          if ($skiko.Count -eq 0) {
            throw 'no libskiko-*.dll in the image — the app cannot draw anything'
          }
          Write-Host "classpath: $($entries.Count) entries, skiko: $($skiko[0].Name)"

      # Настоящий запуск: у раннера нет интерактивной сессии, поэтому окно не
      # откроется — это ожидаемо. Важно, ЧТО при этом упадёт: HeadlessException или
      # отсутствие окна означают, что приложение дошло до отрисовки, то есть
      # classpath цел, Koin собрался, Skiko загрузился. А вот NoClassDefFoundError или
      # NoDefinitionFoundException означают битый образ — такой не публикуем.
      - name: Smoke test the packaged launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          $exe = Join-Path $env:PKG_PATH 'KatYa.exe'
          $previous = $env:JAVA_TOOL_OPTIONS
          $env:JAVA_TOOL_OPTIONS = '-Djava.awt.headless=true'
          $output = ''
          $status = 0
          try {
            $p = Start-Process -FilePath $exe -NoNewWindow -Wait -PassThru `
              -RedirectStandardOutput 'app-out.txt' -RedirectStandardError 'app-err.txt'
            $status = $p.ExitCode
            $output = (Get-Content 'app-out.txt' -Raw -ErrorAction SilentlyContinue) +
                      (Get-Content 'app-err.txt' -Raw -ErrorAction SilentlyContinue)
          } finally {
            $env:JAVA_TOOL_OPTIONS = $previous
          }
          Write-Host $output

          if ($output -match 'NoClassDefFoundError|ClassNotFoundException|NoDefinitionFoundException|UnsatisfiedLinkError|LibraryLoadException') {
            throw 'the packaged app is missing classes or its native library'
          }
          if ($output -notmatch 'HeadlessException') {
            throw "the app did not reach window creation (exit $status) — cannot tell whether it works"
          }
          Write-Host 'The app got as far as creating its window; the image is sound.'

      - name: Determine Version and Tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME
            $version = $tag.TrimStart('v').TrimStart('.')
          } else {
            $version = (Select-String -Path 'gradle/libs.versions.toml' -Pattern 'appVersion = "([^"]+)"' |
              Select-Object -First 1).Matches[0].Groups[1].Value
            $tag = "v$version"
          }
          "TAG_NAME=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Zip the application image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          # Имя каталога внутри zip задаётся явно: иначе архив получит имя папки
          # сборки, и пользователь распакует его в `KatYa` — а в общем случае
          # в папку с именем ревизии или рандома, что неудобно.
          $staging = Join-Path $env:RUNNER_TEMP 'stage'
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item -Recurse -Path "$env:PKG_PATH" -Destination (Join-Path $staging 'KatYa')
          $zip = "Katya-$env:VERSION-windows-amd64.zip"
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $zip -Force
          Remove-Item -Recurse -Force $staging
          Write-Host "$zip $((Get-Item $zip).Length) bytes"

      # Релиз создаёт release.yml. Здесь только ждём его появления и дописываем
      # файл: пересоздание релиза затерело бы описание и оба APK.
      - name: Upload to the existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'stop'
          for ($i = 0; $i -lt 30; $i++) {
            gh release view "$env:TAG_NAME" *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 20
          }
          gh release view "$env:TAG_NAME" *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "release $env:TAG_NAME never appeared — the Android workflow failed?"
          }
          gh release upload "$env:TAG_NAME" "Katya-$env:VERSION-windows-amd64.zip" --clobber
          gh release view "$env:TAG_NAME" --json assets --jq '.assets[].name'
