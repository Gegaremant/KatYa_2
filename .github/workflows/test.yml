name: Unit Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Run Build Checks
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      github.actor != 'github-actions[bot]'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GitHub-hosted runners come with the Android SDK preinstalled
      # (ANDROID_HOME=/usr/local/lib/android/sdk) and accepted licenses.

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Format Code with Spotless
        run: ./gradlew spotlessApply --no-daemon --stacktrace

      # `FossFull` / `FossLite` are the two bundles of the FOSS distribution — the
      # variant name carries both flavor dimensions, so a bare `assembleFossDebug`
      # no longer names anything. `Full` is the one worth gating on: it is the
      # variant that actually ships, and its bundled payloads are absent here on
      # purpose (they are not in git), which is exactly how a fresh checkout looks.
      - name: Build and Verify Code
        run: ./gradlew :androidApp:assembleFossFullDebug --no-daemon --stacktrace

      - name: Unit tests
        # The logic lives in the shared KMP module, so its tests run under the
        # android host-test compilation. `:androidApp:testFossFullDebugUnitTest` on
        # its own would pass with zero tests executed and prove nothing.
        run: ./gradlew :composeApp:testAndroidHostTest :androidApp:testFossFullDebugUnitTest --no-daemon --stacktrace
